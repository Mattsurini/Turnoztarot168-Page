<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Queue Dashboard — Turboztarot168</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e8;--paper:#fffdf8;--ink:#292522;--muted:#766e67;--line:#d8cec1;--accent:#bd684a;--green:#eaf1e5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Superstore","Noto Sans Thai","Leelawadee UI",sans-serif;line-height:1.65}.shell{width:min(1240px,calc(100% - 32px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid var(--line)}a{color:inherit}.brand{font-family:var(--sans);font-weight:800;letter-spacing:.03em;text-decoration:none}.top a{color:var(--muted);font-size:14px}.intro{padding:42px 0 24px;display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{margin:0 0 14px;color:var(--terracotta-dark);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h1,h2,h3{margin:0;font-family:var(--serif);font-weight:500;line-height:1.35;letter-spacing:0}h1{font-size:clamp(48px,8vw,94px);max-width:760px;line-height:1.35;letter-spacing:0}.intro p:not(.eyebrow){color:var(--muted);margin:12px 0 0}.controls{display:flex;gap:10px;align-items:center}.controls select,.controls button{min-height:44px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font:inherit}.controls button{background:var(--ink);color:white;cursor:pointer}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:22px;background:var(--paper);box-shadow:0 14px 38px #43312612}.queue{width:100%;border-collapse:collapse;min-width:980px}.queue th,.queue td{padding:15px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}.queue th{color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:#faf5ed}.queue tr:last-child td{border-bottom:0}.code{font-weight:800;color:var(--accent)}.sub{display:block;color:var(--muted);font-size:12px;margin-top:4px;max-width:220px}.mode{display:inline-block;padding:4px 8px;border-radius:99px;background:#f3dfd5;font-size:12px;font-weight:800}.mode.async{background:#e7eee2}.status{min-height:38px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font:inherit}.empty,.error{padding:32px;text-align:center;color:var(--muted)}.error{color:#9a3f2d}.toast{position:fixed;right:18px;bottom:18px;padding:13px 16px;border-radius:12px;background:var(--ink);color:#fff;display:none}.toast.show{display:block}@media(max-width:720px){.intro{display:block}.controls{margin-top:20px}}
/* Turboztarot168 shared dark system */
@font-face{font-family:"Superstore";src:url("https://techsauce.co/font/Superstore-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:"Superstore";src:url("https://techsauce.co/font/Superstore-Bold.woff") format("woff");font-style:normal;font-weight:700;font-display:swap}
:root{--ivory:#181818;--paper:#303030;--ink:#fff;--muted:#969696;--line:#484848;--terracotta:#da291c;--terracotta-dark:#9d2211;--clay:#da291c;--sage:#303030;--bg:#181818;--accent:#da291c;--green:#303030;--shadow:none;--radius-lg:0;--radius-md:0;--serif:"Superstore","Noto Sans Thai",sans-serif;--sans:"Superstore","Noto Sans Thai","Leelawadee UI",sans-serif}
html,body{background:#181818;color:#fff;font-family:var(--sans)}
button,input,select,textarea,table,.toast{font-family:var(--sans)}
h1,h2,h3,.promise strong{font-family:var(--serif);font-weight:500;line-height:1.35;letter-spacing:0}.brand{font-family:var(--sans);font-weight:800}.brand-mark,.section-number{font-family:var(--serif);font-weight:400}
.topbar,.top{border-bottom-color:#484848}.back,.top a{color:#969696}.back:hover,.back:focus-visible,.top a:hover,.top a:focus-visible{color:#fff}
.promise,.form-card,.summary-card,.table-wrap{border:1px solid #484848;border-radius:0;background:#303030;box-shadow:none}
input,textarea,select,.controls select,.controls button,.status{border:1px solid #484848;border-radius:0;background:#181818;color:#fff}
input::placeholder,textarea::placeholder{color:#777}.choice{border-color:#484848;border-radius:0;background:#303030}.choice:hover,.choice:has(input:checked){border-color:#da291c;background:#3a201d}.conditional{border-radius:0;background:#181818}.button,button,.controls button{border-radius:0;background:#da291c;border-color:#da291c;color:#fff}.button:hover,.button:focus-visible,button:hover,button:focus-visible,.controls button:hover{background:#9d2211;border-color:#9d2211}
.table-wrap{overflow:auto}.queue th{background:#181818;color:#969696}.queue th,.queue td{border-bottom-color:#484848}.mode{border-radius:0;background:#3a201d;color:#fff}.mode.async{background:#26352c}.success{border-color:#49654d;border-radius:0;background:#26352c}.success p{color:#b7c8b8}.error{color:#ff8a7a}.toast{border-radius:0;background:#da291c;color:#fff}</style></head>
<body><header class="shell top"><a class="brand" href="/index.html">Turboztarot168 · Queue</a><a href="/booking.html">เปิดฟอร์มรับคิว ↗</a></header>
<main class="shell"><section class="intro"><div><p class="eyebrow">Internal / local-first</p><h1>Reading Queue</h1><p>รายการคิวที่เก็บใน Standalone Queue App — ยังไม่ Sync ไป Notion</p></div><div class="controls"><select id="filter"><option value="">ทุกสถานะ</option><option>รอตรวจสอบ</option><option>รับคิวแล้ว</option><option>กำลังอ่าน</option><option>ส่งผลแล้ว</option><option>ปิดงาน</option><option>พักคิว</option><option>ยกเลิก</option></select><button id="refresh">รีเฟรช</button></div></section>
<section class="table-wrap"><table class="queue"><thead><tr><th>Booking</th><th>บริการ</th><th>ลูกค้า / คำถาม</th><th>นัดหมาย / กำหนดส่ง</th><th>สถานะ</th><th>อัปเดต</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">กำลังโหลดคิว…</td></tr></tbody></table></section></main><div class="toast" id="toast"></div>
<script>
const rows=document.getElementById('rows'),filter=document.getElementById('filter'),toast=document.getElementById('toast');
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function detail(item){if(item.serviceMode==='call')return `${esc(item.appointmentDate||'-')} ${esc(item.appointmentTime||'')}`;return `คิว #${esc(item.queueNumber||'-')}<span class="sub">${esc(item.estimatedDeliveryDate||'ยังไม่กำหนด')}</span>`}
async function load(){rows.innerHTML='<tr><td colspan="6" class="empty">กำลังโหลดคิว…</td></tr>';try{const q=filter.value?`?status=${encodeURIComponent(filter.value)}`:'';const r=await fetch(`/api/queue${q}`,{cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error);if(!data.items.length){rows.innerHTML='<tr><td colspan="6" class="empty">ยังไม่มีรายการคิว</td></tr>';return}rows.innerHTML=data.items.map(item=>`<tr><td><span class="code">${esc(item.bookingCode)}</span><span class="sub">${esc(new Date(item.createdAt).toLocaleString('th-TH'))}</span></td><td><span class="mode ${item.serviceMode==='async'?'async':''}">${item.serviceMode==='call'?'Call':'ส่งตามคิว'}</span><span class="sub">${esc(item.packageName)}</span></td><td><strong>${esc(item.displayName)}</strong><span class="sub">${esc(item.contact)}<br>${esc(item.question)}</span></td><td>${detail(item)}</td><td><select class="status" data-code="${esc(item.bookingCode)}">${['รอตรวจสอบ','รับคิวแล้ว','กำลังอ่าน','ส่งผลแล้ว','ปิดงาน','พักคิว','ยกเลิก'].map(s=>`<option ${s===item.status?'selected':''}>${s}</option>`).join('')}</select></td><td>${esc(new Date(item.updatedAt).toLocaleString('th-TH'))}</td></tr>`).join('');document.querySelectorAll('.status').forEach(el=>el.addEventListener('change',update));}catch(e){rows.innerHTML=`<tr><td colspan="6" class="error">โหลดคิวไม่สำเร็จ: ${esc(e.message)}</td></tr>`}}
async function update(e){const el=e.target;const r=await fetch(`/api/queue/${encodeURIComponent(el.dataset.code)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:el.value})});if(!r.ok){toast.textContent='อัปเดตไม่สำเร็จ';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200);return}toast.textContent='อัปเดตสถานะแล้ว';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
filter.addEventListener('change',load);document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
