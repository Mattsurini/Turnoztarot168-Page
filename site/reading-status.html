<!doctype html>
<html lang="th"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="เช็กสถานะคิวการอ่านไพ่ของ Turboztarot168 ด้วย Booking Code">
  <title>Reading Status — Turboztarot168</title>
    <style>
      @font-face { font-family: "Superstore"; src: url("https://techsauce.co/font/Superstore-Regular.woff2") format("woff2"); font-style: normal; font-weight: 400; font-display: swap; }
      @font-face { font-family: "Superstore"; src: url("https://techsauce.co/font/Superstore-Bold.woff") format("woff"); font-style: normal; font-weight: 700; font-display: swap; }
    :root {
      --ivory: #f6f1e8;
      --paper: #fffdf8;
      --ink: #292522;
      --muted: #766e67;
      --line: #d8cec1;
      --terracotta: #bd684a;
      --terracotta-dark: #8f4935;
      --radius-lg: 28px;
      --radius-md: 18px;
      --serif: "Superstore", "Noto Sans Thai", sans-serif;
      --sans: "Superstore", "Noto Sans Thai", "Leelawadee UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ivory); color: var(--ink); font-family: var(--sans); line-height: 1.65; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: inherit; }
    .wrap { width: min(600px, calc(100% - 36px)); margin: auto; }
    header { padding: 24px 0; border-bottom: 1px solid rgba(216,206,193,.75); text-align: center; }
    .brand { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; font-weight: 800; letter-spacing: .03em; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--terracotta); color: #fffaf2; font-family: var(--serif); font-size: 20px; }
    main { flex: 1; padding: 64px 0; }
    h1 { margin: 0 0 8px; font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 5vw, 42px); line-height: 1.35; }
    .sub { color: var(--muted); margin: 0 0 32px; font-size: 15px; }
    .lookup-card { padding: 28px; border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius-lg); }
    .field-group { display: flex; gap: 10px; align-items: stretch; }
    .field-group input { flex: 1; min-height: 46px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; outline: none; }
    .field-group input:focus { border-color: var(--terracotta); box-shadow: 0 0 0 3px rgba(189,104,74,.15); }
    .button { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; gap: 8px; padding: 10px 22px; border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: #fffdf8; text-decoration: none; font-weight: 700; font-size: 14px; cursor: pointer; transition: transform .2s ease, background .2s ease; white-space: nowrap; }
    .button:hover, .button:focus-visible { transform: translateY(-2px); background: var(--terracotta-dark); }
    .result-card { margin-top: 28px; padding: 28px; border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius-lg); }
    .result-card h2 { margin: 0 0 16px; font-family: var(--serif); font-size: 22px; }
    .result-card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 20px; align-items: baseline; }
    .result-card dt { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .result-card dd { margin: 0; font-size: 15px; }
    .loading { margin-top: 28px; text-align: center; color: var(--muted); font-size: 14px; }
    .error { margin-top: 20px; padding: 14px 18px; border-radius: var(--radius-md); background: #fdecea; color: var(--terracotta-dark); font-size: 14px; }
    .back-link { display: inline-block; margin-top: 32px; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 4px; }
    .back-link:hover { color: var(--terracotta-dark); }
    .hint { margin-top: 20px; color: var(--muted); font-size: 13px; }
    footer { padding: 24px 0 40px; text-align: center; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
    @media (max-width: 480px) {
      .wrap { width: min(100% - 26px, 600px); }
      .field-group { flex-direction: column; }
      .button { width: 100%; }
    }
    :root { --ivory:#181818; --paper:#303030; --ink:#fff; --muted:#969696; --line:#303030; --terracotta:#da291c; --terracotta-dark:#9d2211; --radius-lg:0; --radius-md:0; }
    body { background:var(--ivory); color:var(--ink); }
    header, footer { background:var(--ivory); border-color:var(--line); }
    .brand-mark { border-radius:0; background:var(--terracotta); color:#fff; }
    .sub, .hint, .back-link, .loading, .result-card dt { color:var(--muted); }
    .lookup-card, .result-card { border-color:var(--line); border-radius:0; background:var(--paper); }
    .field-group input { min-height:48px; border-radius:4px; border-color:#666; background:var(--ivory); color:var(--ink); }
    .field-group input:focus { border-color:var(--terracotta); box-shadow:0 0 0 3px rgba(218,41,28,.22); }
    .button { min-height:48px; padding:14px 24px; border-radius:0; border-color:var(--terracotta); background:var(--terracotta); color:#fff; letter-spacing:1.1px; text-transform:uppercase; }
    .button:hover, .button:focus-visible { background:#9d2211; }
    .error { border-radius:0; background:#551f1b; color:#fff; border:1px solid var(--terracotta); }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="./index.html" aria-label="กลับหน้า Turboztarot168"><span class="brand-mark">T</span><span>Turboztarot168</span></a>
    </div>
  </header>
  <main>
    <div class="wrap">
      <h1>เช็กสถานะคิว</h1>
      <p class="sub">กรอกรหัสคิว เช่น BR-0001 ที่ Turboztarot168 ส่งให้หลังยืนยันคิว</p>
      <div class="lookup-card">
        <form id="status-form">
          <div class="field-group">
            <input type="text" id="booking-code" placeholder="รหัสคิว เช่น BR-0001" aria-label="รหัสคิว" autocomplete="off" required="">
            <button type="submit" class="button">ตรวจสอบ</button>
          </div>
        </form>
      </div>
      <div class="result-card" id="result-card" hidden="">
        <h2>รายละเอียดคิว</h2>
        <dl id="result-fields"></dl>
      </div>
      <div class="loading" id="loading" hidden="">กำลังตรวจสอบ...</div>
      <div class="error" id="error-msg" hidden=""></div>
      <p class="hint">ไม่พบรหัสคิว? <a href="https://line.me/R/ti/p/@330dvugn" target="_blank" rel="noopener">ติดต่อ Turboztarot168 ทาง LINEOA</a></p>
      <a class="back-link" href="./index.html">← กลับหน้าเลือกแพ็กเกจ</a>
    </div>
  </main>
  <footer><div class="wrap">© Turboztarot168 Reading Studio</div></footer>
  <script src="/js/reading-status.js"></script>



</body></html>
