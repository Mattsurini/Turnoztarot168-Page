name: Quality Gate

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: node --test tests/*.test.js
      - name: Build
        run: npm run build
      - name: Check Hanbi syntax
        run: |
          if [ -f "$HOME/AppData/Local/hermes/profiles/hanbi/scripts/boom_queue_watch.py" ]; then
            python -m py_compile "$HOME/AppData/Local/hermes/profiles/hanbi/scripts/boom_queue_watch.py"
          else
            echo "Hanbi script is managed outside this repository; skipping local-profile compile."
          fi
      - name: Check whitespace
        run: git diff --check
