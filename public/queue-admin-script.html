<script>
const rows = document.getElementById('rows');
const filter = document.getElementById('filter');
const toast = document.getElementById('toast');
const statuses = ['รอตรวจสอบ','รับคิวแล้ว','กำลังอ่าน','ส่งผลแล้ว','ปิดงาน','พักคิว','ยกเลิก'];
function esc(value) { return String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function timeText(value) { const d = new Date(value); return Number.isNaN(d.getTime()) ? '-' : d.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit', hour12:false }) + ' น.'; }
function dateText(value) { if (!value) return '-'; const d = new Date(`${value}T00:00:00+07:00`); return Number.isNaN(d.getTime()) ? esc(value) : d.toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'2-digit', timeZone:'Asia/Bangkok' }); }
function queueLabel(item) { return item.queueCode || (item.queueNumber != null ? `BR-${String(item.queueNumber).padStart(4, '0')}` : 'Call'); }
function detail(item) { if (item.serviceMode === 'call') return `${dateText(item.appointmentDate)}<span class="sub">เวลา ${esc(item.appointmentTime || '-')} น.</span>`; return `รับคำขอ ${timeText(item.createdAt)}<span class="sub">${item.estimatedDeliveryDate ? `กำหนดส่ง ${dateText(item.estimatedDeliveryDate)}` : 'ยังไม่กำหนดส่ง'}</span>`; }
function rowHtml(item) {
  const statusOptions = statuses.map((s) => `<option ${s === item.status ? 'selected' : ''}>${s}</option>`).join('');
  return `<tr><td><span class="code">${esc(queueLabel(item))}</span><span class="sub">${esc(new Date(item.createdAt).toLocaleString('th-TH'))}</span></td><td><span class="mode ${item.serviceMode === 'async' ? 'async' : ''}">${item.serviceMode === 'call' ? 'Call' : 'ส่งตามคิว'}</span><span class="sub">${esc(item.packageName)}</span></td><td><strong>${esc(item.displayName)}</strong><span class="sub">${esc(item.contact)}<br>${esc(item.question)}</span></td><td>${detail(item)}</td><td><select class="status" data-code="${esc(item.bookingCode)}">${statusOptions}</select></td><td>${esc(new Date(item.updatedAt).toLocaleString('th-TH'))}</td></tr>`;
}
async function load() {
  rows.innerHTML = '<tr><td colspan="6" class="empty">กำลังโหลดคิว…</td></tr>';
  try {
    const query = filter.value ? `?status=${encodeURIComponent(filter.value)}` : '';
    const response = await fetch(`/api/queue${query}`, { cache:'no-store' });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    rows.innerHTML = data.items.length ? data.items.map(rowHtml).join('') : '<tr><td colspan="6" class="empty">ยังไม่มีรายการคิว</td></tr>';
    document.querySelectorAll('.status').forEach((element) => element.addEventListener('change', update));
  } catch (error) { rows.innerHTML = `<tr><td colspan="6" class="error">โหลดคิวไม่สำเร็จ: ${esc(error.message)}</td></tr>`; }
}
async function update(event) {
  const element = event.target;
  const response = await fetch(`/api/queue/${encodeURIComponent(element.dataset.code)}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ status:element.value }) });
  toast.textContent = response.ok ? 'อัปเดตสถานะแล้ว' : 'อัปเดตไม่สำเร็จ'; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1800);
}
filter.addEventListener('change', load);
document.getElementById('refresh').addEventListener('click', load);
load();
</script>
